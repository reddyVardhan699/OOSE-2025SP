name: Run Unit Tests

on:
  push:
    branches:
      - HW6-testing
  pull_request:
    branches:
      - HW6-testing

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 27
        uses: actions/setup-java@v4
        with:
          java-version: '27'
          distribution: 'oracle'
          cache: maven

      - name: Run Maven tests
        run: mvn test